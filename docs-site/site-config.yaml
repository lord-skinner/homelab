apiVersion: v1
kind: ConfigMap
metadata:
  name: homelab-docs
  namespace: docs-site
data:
  index.html: |
    <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Datalab homelab operations and AI gateway documentation"><title>Datalab / Homelab</title><link rel="stylesheet" href="/styles.css"></head><body>
    <aside class="sidebar"><a class="brand" href="#top"><span class="mark">D</span><span>Datalab <small>HOMELAB</small></span></a><nav><a href="#overview">Overview</a><a href="#architecture">Architecture</a><a href="#services">Services</a><a href="#ai">AI Gateway</a><a href="#operations">Operations</a><a href="#runbooks">Runbooks</a></nav><div class="sidebar-foot">Private · Tailscale only<br><code>docs.home.datalab.gg</code></div></aside>
    <main id="top"><header class="hero"><div class="eyebrow">HOMELAB PLATFORM · 2026</div><h1>Everything in one<br><em>calm place.</em></h1><p class="lede">A practical map of the Datalab cluster: services, ingress, AI routing, and the small set of checks that keep it dependable.</p><div class="chips"><span>☁ K3s</span><span>◈ Envoy Gateway</span><span>⌁ Tailscale</span><span>✦ Ollama + OpenRouter</span></div></header>
    <section id="overview" class="section"><div class="section-label">01 / OVERVIEW</div><div class="grid two"><div><h2>Private by default.</h2><p>The home ingress is an Envoy-managed Tailscale LoadBalancer. The wildcard certificate is terminated at the shared Gateway, while application Services remain internal to the cluster.</p></div><div class="callout"><strong>Entry point</strong><code>https://&lt;service&gt;.home.datalab.gg</code><span>Reachable through the tailnet; no public load balancer is created.</span></div></div></section>
    <section id="architecture" class="section tint"><div class="section-label">02 / ARCHITECTURE</div><h2>One edge, clear boundaries.</h2><div class="flow"><div><b>Client</b><span>Tailnet device</span></div><i>→</i><div><b>Envoy Gateway</b><span>HTTPS + routing</span></div><i>→</i><div><b>HTTPRoute</b><span>host-based policy</span></div><i>→</i><div><b>Service</b><span>cluster-internal</span></div></div><p class="muted">The Gateway lives in <code>kube-system</code>. Routes are explicitly admitted from labeled application namespaces. HTTP is retained only to issue permanent HTTPS redirects.</p></section>
    <section id="services" class="section"><div class="section-label">03 / SERVICES</div><h2>What is running.</h2><div class="cards"><a class="card" href="https://automate.home.datalab.gg/"><span class="card-icon">↗</span><h3>n8n</h3><p>Workflow automation</p><code>automate.home.datalab.gg</code></a><a class="card" href="https://nas.home.datalab.gg/"><span class="card-icon">▦</span><h3>Nextcloud</h3><p>Files and collaboration</p><code>nas.home.datalab.gg</code></a><a class="card" href="https://es.home.datalab.gg/"><span class="card-icon">⌕</span><h3>Kibana</h3><p>Search and observability</p><code>es.home.datalab.gg</code></a><a class="card" href="https://llm.home.datalab.gg/"><span class="card-icon">✦</span><h3>LLM Gateway</h3><p>Local and remote inference</p><code>llm.home.datalab.gg</code></a></div></section>
    <section id="ai" class="section tint"><div class="section-label">04 / AI GATEWAY</div><h2>Route for the task, keep a fallback.</h2><p>The AI edge combines Envoy AI Gateway with vLLM Semantic Router. Local Ollama models are the automatic first choice; qualified OpenRouter models are registered for explicit use and future fallback policies.</p><div class="table"><div class="tr th"><span>Lane</span><span>Model</span><span>Use</span></div><div class="tr"><span>Default</span><code>qwen3:14b</code><span>General chat</span></div><div class="tr"><span>Coding</span><code>qwen2.5-coder:14b</code><span>Code and tooling</span></div><div class="tr"><span>Reasoning</span><code>deepseek-r1:14b</code><span>Deep analysis</span></div><div class="tr"><span>Math</span><code>phi4:14b</code><span>Quantitative tasks</span></div><div class="tr"><span>Multimodal</span><code>gemma4:latest</code><span>Media and language lanes</span></div></div><p class="note">Cloud candidates remain opt-in until their quality, rate limits, modality support, and reliability are qualified.</p></section>
    <section id="operations" class="section"><div class="section-label">05 / OPERATIONS</div><h2>Small checks, useful signals.</h2><div class="grid two"><div><h3>Health check</h3><p>Run the non-mutating cluster check from the repository:</p><pre>LOG_WINDOW=2m ./scripts/cluster-health-check.sh</pre></div><div><h3>Change safely</h3><p>Apply manifests through their component script, inspect Gateway and Route conditions, then smoke-test the hostname over HTTPS. Keep the prior route available through the soak period.</p><pre>kubectl get gateway,httproute -A</pre></div></div></section>
    <section id="runbooks" class="section tint"><div class="section-label">06 / RUNBOOKS</div><h2>When things need attention.</h2><div class="runbooks"><div><b>Ingress</b><span>Check GatewayClass, Gateway listeners, HTTPRoute conditions, and proxy endpoints.</span></div><div><b>AI routing</b><span>Check AIGatewayRoute and AIServiceBackend conditions, then test with an explicit model.</span></div><div><b>Rollback</b><span>Restore the previous Tailscale Service and route resources before changing DNS.</span></div></div><p class="muted">The repository remains the source of truth for manifests and detailed component notes. This site is the human-friendly operational index.</p></section><footer><span>DATALAB / HOMELAB</span><span>Built from the cluster repository · private documentation</span></footer></main></body></html>
  styles.css: |
    :root{--ink:#182322;--muted:#687674;--line:#dce5e1;--paper:#f7faf8;--green:#0d7059;--orange:#e78145}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}.sidebar{position:fixed;inset:0 auto 0 0;width:250px;background:#102422;color:#d8e9e2;padding:32px 26px;display:flex;flex-direction:column}.brand{color:#fff;text-decoration:none;display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.02em}.brand small{display:block;color:#82b8a5;font-size:9px;letter-spacing:.18em}.mark{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--orange);color:#102422;font-weight:900}.sidebar nav{display:grid;gap:7px;margin-top:70px}.sidebar nav a{color:#9cbab0;text-decoration:none;padding:8px 0}.sidebar nav a:hover{color:#fff}.sidebar-foot{margin-top:auto;color:#6f9287;font-size:12px}.sidebar code{color:#b5d8ca}main{margin-left:250px}.hero{padding:104px max(7vw,54px) 90px;background:linear-gradient(135deg,#e5f6ee,#f7faf8 65%);min-height:480px}.eyebrow,.section-label{font-size:11px;letter-spacing:.18em;color:var(--green);font-weight:800}.hero h1{font-size:clamp(46px,7vw,90px);line-height:1.03;letter-spacing:-.07em;margin:25px 0;color:#102422}.hero h1 em{color:var(--green);font-family:Georgia,serif;font-weight:400}.lede{max-width:580px;font-size:20px;color:#50625e}.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:30px}.chips span{border:1px solid #b9d8ca;border-radius:99px;padding:5px 12px;color:var(--green);font-size:13px;background:#effaf4}.section{padding:78px max(7vw,54px);max-width:1200px}.section.tint{max-width:none;background:#eef5f1}.section h2{font-size:38px;line-height:1.1;letter-spacing:-.04em;margin:15px 0 22px}.section h3{margin-bottom:4px}.grid.two{display:grid;grid-template-columns:1.4fr 1fr;gap:60px;align-items:start}.callout{border-left:3px solid var(--orange);padding:18px 24px;background:#fff}.callout strong,.callout code,.callout span{display:block}.callout code{margin:8px 0;color:var(--green)}.callout span,.muted,.note{color:var(--muted);font-size:14px}.flow{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:38px 0}.flow div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;min-width:150px}.flow b,.flow span{display:block}.flow span{font-size:13px;color:var(--muted)}.flow i{font-size:24px;color:var(--orange)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);padding:22px;text-decoration:none;color:var(--ink);border-radius:12px;transition:.2s}.card:hover{transform:translateY(-3px);border-color:#8fc8b0}.card h3{margin:12px 0 0}.card p{margin:0 0 12px;color:var(--muted);font-size:14px}.card code{font-size:11px;color:var(--green)}.card-icon{font-size:22px;color:var(--orange)}.table{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:28px 0}.tr{display:grid;grid-template-columns:1fr 1.5fr 1.5fr;gap:12px;padding:11px 17px;border-bottom:1px solid var(--line);font-size:14px}.tr:last-child{border:0}.tr.th{background:#e3f2ea;color:var(--green);font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:800}.tr code{color:#a45129}pre{background:#172a27;color:#cbe9dc;padding:14px 17px;border-radius:8px;overflow:auto;font-size:13px}.runbooks{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.runbooks div{border-top:2px solid var(--orange);padding-top:15px}.runbooks b,.runbooks span{display:block}.runbooks span{color:var(--muted);font-size:14px;margin-top:5px}footer{display:flex;justify-content:space-between;padding:28px max(7vw,54px);font-size:11px;letter-spacing:.1em;color:#78928a;border-top:1px solid var(--line)}@media(max-width:800px){.sidebar{position:static;width:auto;height:auto;padding:20px;display:block}.sidebar nav{display:flex;gap:15px;overflow:auto;margin-top:20px}.sidebar-foot{display:none}main{margin:0}.hero{padding:65px 25px}.section{padding:55px 25px}.grid.two,.cards,.runbooks{grid-template-columns:1fr}.flow{align-items:stretch;flex-direction:column}.flow i{text-align:center;transform:rotate(90deg)}footer{display:block;padding:25px}.tr{grid-template-columns:1fr 1fr}.tr span:last-child{grid-column:1/-1}}
