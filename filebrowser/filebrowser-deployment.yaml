apiVersion: apps/v1
kind: Deployment
metadata:
  name: filebrowser
  namespace: filebrowser
spec:
  # Single replica: both PVCs are ReadWriteOnce (local-path).
  replicas: 1
  selector:
    matchLabels:
      app: filebrowser
  template:
    metadata:
      labels:
        app: filebrowser
    spec:
      # Image runs as UID/GID 1000; fsGroup gives it ownership of the
      # local-path volumes.
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: filebrowser
          # Pinned digest of filebrowser/filebrowser:v2 (multi-arch list,
          # includes arm64) for reproducible deploys.
          image: filebrowser/filebrowser@sha256:a469ea076d4a1b4b1d86a41d130f2f536cd9da996a2b1fb39c0d7635f9d89b9a
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            # Served files. Local PVC for now; see NFS note below.
            - name: data
              mountPath: /srv
            - name: state
              mountPath: /database
              subPath: database
            - name: state
              mountPath: /config
              subPath: config
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: filebrowser-data
        # NAS MOUNT (skinner-nas, 192.168.0.243) — NOT active yet.
        # The NAS currently filters all TCP from the cluster subnet
        # (nmap from a pod: all top-100 ports filtered), so an NFS mount
        # cannot work until the NAS firewall allows 10.0.0.0/24 and an
        # NFS export exists. When ready, replace the `data` volume above
        # with:
        #   - name: data
        #     nfs:
        #       server: 192.168.0.243
        #       path: /<export-path>
        # and keep filebrowser-data as a fallback or delete it.
        - name: state
          persistentVolumeClaim:
            claimName: filebrowser-state
