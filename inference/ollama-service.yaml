apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: inference
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/component: inference-provider
spec:
  ports:
    - name: http
      port: 11434
      protocol: TCP
      targetPort: 11434
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ollama-1
  namespace: inference
  labels:
    kubernetes.io/service-name: ollama
    endpointslice.kubernetes.io/managed-by: homelab
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 11434
endpoints:
  - addresses:
      - 192.168.0.254
    conditions:
      ready: true
