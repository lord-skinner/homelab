apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: ollama
  namespace: inference
spec:
  endpoints:
    - fqdn:
        hostname: ollama.inference.svc.cluster.local
        port: 11434
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: ollama-qwen3-14b
  namespace: inference
spec:
  schema:
    name: OpenAI
    version: v1
  backendRef:
    name: ollama
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: ollama-qwen2-5-coder-14b
  namespace: inference
spec:
  schema:
    name: OpenAI
    version: v1
  backendRef:
    name: ollama
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: ollama-deepseek-r1-14b
  namespace: inference
spec:
  schema:
    name: OpenAI
    version: v1
  backendRef:
    name: ollama
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: ollama-phi4-14b
  namespace: inference
spec:
  schema:
    name: OpenAI
    version: v1
  backendRef:
    name: ollama
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: ollama-gemma4-latest
  namespace: inference
spec:
  schema:
    name: OpenAI
    version: v1
  backendRef:
    name: ollama
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: ollama-models
  namespace: inference
spec:
  hostnames:
    - llm.home.datalab.gg
  parentRefs:
    - name: home-ingress
      namespace: kube-system
      kind: Gateway
      group: gateway.networking.k8s.io
  rules:
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: qwen3:14b
      backendRefs:
        - name: ollama-qwen3-14b
          modelNameOverride: qwen3:14b
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: qwen2.5-coder:14b
      backendRefs:
        - name: ollama-qwen2-5-coder-14b
          modelNameOverride: qwen2.5-coder:14b
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: deepseek-r1:14b
      backendRefs:
        - name: ollama-deepseek-r1-14b
          modelNameOverride: deepseek-r1:14b
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: phi4:14b
      backendRefs:
        - name: ollama-phi4-14b
          modelNameOverride: phi4:14b
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: gemma4:latest
      backendRefs:
        - name: ollama-gemma4-latest
          modelNameOverride: gemma4:latest
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: cohere/north-mini-code:free
      backendRefs:
        - name: openrouter-north-mini-code
          modelNameOverride: cohere/north-mini-code:free
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: google/gemma-4-26b-a4b-it:free
      backendRefs:
        - name: openrouter-gemma4-26b
          modelNameOverride: google/gemma-4-26b-a4b-it:free
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
      backendRefs:
        - name: openrouter-nemotron-omni
          modelNameOverride: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: inclusionai/ling-3.0-flash-vl:free
      backendRefs:
        - name: openrouter-ling-vl
          modelNameOverride: inclusionai/ling-3.0-flash-vl:free
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: nex-agi/nex-n2.5-pro:free
      backendRefs:
        - name: openrouter-nex-n25-pro
          modelNameOverride: nex-agi/nex-n2.5-pro:free
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: liquid/lfm-2.5-2.6b:free
      backendRefs:
        - name: openrouter-lfm25
          modelNameOverride: liquid/lfm-2.5-2.6b:free
