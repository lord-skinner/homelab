        hostname: ollama.inference.svc.cluster.local
        port: 11434
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: ollama-qwen3-14b
  namespace: inference
spec:
  schema:
    name: OpenAI
    version: v1
  backendRef:
    name: ollama
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: ollama-qwen2-5-coder-14b
  namespace: inference
