apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: openrouter-resilience
  namespace: inference
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ollama-models
  retry:
    numRetries: 2
    perRetry:
      timeout: 20s
      backOff:
        baseInterval: 1s
        maxInterval: 8s
    retryOn:
      httpStatusCodes: [429, 500, 502, 503, 504]
      triggers: ["5xx", "connect-failure", "reset"]
  circuitBreaker:
    maxParallelRequests: 32
    maxPendingRequests: 64
    maxParallelRetries: 4
    maxRequestsPerConnection: 100
  healthCheck:
    passive:
      consecutive5XxErrors: 5
      consecutiveGatewayErrors: 5
      baseEjectionTime: 30s
      maxEjectionPercent: 50
