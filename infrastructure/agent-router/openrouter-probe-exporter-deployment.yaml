apiVersion: apps/v1
kind: Deployment
metadata:
  name: openrouter-probe-exporter
  namespace: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openrouter-probe-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openrouter-probe-exporter
    spec:
      containers:
        - name: exporter
          image: python:3.12-alpine
          command: ["python", "/app/exporter.py"]
          env:
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openrouter-api-key
                  key: apiKey
            - name: PROBE_INTERVAL_SECONDS
              value: "300"
          ports:
            - name: metrics
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /metrics, port: metrics}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
          volumeMounts:
            - name: exporter
              mountPath: /app
      volumes:
        - name: exporter
          configMap:
            name: openrouter-probe-exporter
---
apiVersion: v1
kind: Service
metadata:
  name: openrouter-probe-exporter
  namespace: inference
spec:
  selector:
    app.kubernetes.io/name: openrouter-probe-exporter
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
