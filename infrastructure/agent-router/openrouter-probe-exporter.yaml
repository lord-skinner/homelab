apiVersion: v1
kind: ConfigMap
metadata:
  name: openrouter-probe-exporter
  namespace: inference
data:
  exporter.py: |
    import json, os, time, urllib.request, urllib.error
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    MODELS={"cohere/north-mini-code:free":"north-mini-code","nex-agi/nex-n2.5-pro:free":"nex-n25-pro","liquid/lfm-2.5-2.6b:free":"lfm25","inclusionai/ling-3.0-flash-vl:free":"ling-vl","nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free":"nemotron-omni"}
    state={a:{"success":0,"status":0,"latency":0.0,"failures":0,"provider":"unknown"} for a in MODELS.values()}
    key=os.environ["OPENROUTER_API_KEY"]
    interval=int(os.getenv("PROBE_INTERVAL_SECONDS","300"))
    def render():
      lines=[]
      for alias,item in state.items():
        labels=f'model="{alias}"'; provider=item["provider"].replace('\\','_').replace('"',"'")
        lines += [f'openrouter_model_probe_success{{{labels}}} {item["success"]}',f'openrouter_model_probe_status_code{{{labels}}} {item["status"]}',f'openrouter_model_probe_latency_seconds{{{labels}}} {item["latency"]}',f'openrouter_model_probe_consecutive_failures{{{labels}}} {item["failures"]}',f'openrouter_model_provider_info{{{labels},provider="{provider}"}} 1']
      return "\n".join(lines)+"\n"
    def probe(model,alias):
      payload=json.dumps({"model":model,"messages":[{"role":"user","content":"Reply with OK."}],"max_tokens":4,"stream":False}).encode(); request=urllib.request.Request("https://openrouter.ai/api/v1/chat/completions",data=payload,headers={"Authorization":f"Bearer {key}","Content-Type":"application/json","HTTP-Referer":"https://llm.home.datalab.gg"}); started=time.monotonic(); status=0; provider="unknown"; success=0
      try:
        with urllib.request.urlopen(request,timeout=45) as response:
          status=response.status; body=json.loads(response.read().decode()); provider=body.get("provider","unknown"); success=int(200<=status<300 and bool(body.get("choices")))
      except urllib.error.HTTPError as error:
        status=error.code
        try: provider=json.loads(error.read().decode()).get("provider","unknown")
        except Exception: pass
      except Exception: pass
      item=state[alias]; item.update(success=success,status=status,latency=round(time.monotonic()-started,3),provider=str(provider)[:80]); item["failures"]=0 if success else item["failures"]+1
    class Handler(BaseHTTPRequestHandler):
      def do_GET(self):
        if self.path != "/metrics": self.send_response(404); self.end_headers(); return
        data=render().encode(); self.send_response(200); self.send_header("Content-Type","text/plain; version=0.0.4"); self.send_header("Content-Length",str(len(data))); self.end_headers(); self.wfile.write(data)
      def log_message(self,*args): pass
    import threading
    threading.Thread(target=lambda: ThreadingHTTPServer(("0.0.0.0",8080),Handler).serve_forever(),daemon=True).start()
    while True:
      for model,alias in MODELS.items(): probe(model,alias)
      time.sleep(interval)
