# Let's Encrypt PRODUCTION ClusterIssuer using Cloudflare DNS-01.
# Created only after the staging issuer proved DNS-01 works.
# Same credential reference: in-cluster Secret
#   cert-manager/cloudflare-api-token  (key: api-token), never in Git.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: mshskinner@gmail.com
    privateKeySecretRef:
      name: letsencrypt-production
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
