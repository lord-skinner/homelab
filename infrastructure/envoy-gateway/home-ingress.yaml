apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: home-ingress
  namespace: kube-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: LoadBalancer
        loadBalancerClass: tailscale
        allocateLoadBalancerNodePorts: false
        externalTrafficPolicy: Cluster
        annotations:
          tailscale.com/hostname: home-ingress
  telemetry:
    metrics:
      prometheus: {}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: home-ingress
  namespace: kube-system
  annotations:
    # The generated Envoy Service is configured by EnvoyProxy/home-ingress.
    homelab.datalab.gg/migration-stage: cutover
spec:
  gatewayClassName: envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: home-ingress
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: '*.home.datalab.gg'
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: '*.home.datalab.gg'
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: home-datalab-gg-wildcard-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access: home-ingress
