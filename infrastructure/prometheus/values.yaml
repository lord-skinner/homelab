# Prometheus is the scraper and remote-write compatibility layer only.
# Elasticsearch is the metrics store and Kibana is the visualization layer.
grafana:
  enabled: false

alertmanager:
  enabled: false

defaultRules:
  create: false

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true

prometheus:
  enabled: true
  prometheusSpec:
    replicas: 1
    retention: 24h
    scrapeInterval: 30s
    evaluationInterval: 30s
    walCompression: true
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    remoteWrite:
      - url: https://elasticsearch-es-http.elastic-stack.svc.cluster.local:9200/_prometheus/api/v1/write
        basicAuth:
          username:
            name: prometheus-elasticsearch-auth
            key: username
          password:
            name: prometheus-elasticsearch-auth
            key: password
        tlsConfig:
          insecureSkipVerify: true
    storageSpec:
      emptyDir: {}

prometheusOperator:
  enabled: true
